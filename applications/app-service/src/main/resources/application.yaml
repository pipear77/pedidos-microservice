server:
  port: 8082
spring:
  application:
    name: "pedidos"
  devtools:
    add-properties: false
  data:
    mongodb:
      uri: "mongodb://localhost:27017/pedidos_db"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
jwt:
  secret: "una-clave-secreta-muy-larga-y-segura-para-firmar-el-token-123456"
adapter:
  restconsumer:
    url: "http://localhost:8080"
  traceability:
    url: "http://localhost:8083"