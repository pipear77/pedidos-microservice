server:
  port: 8082
spring:
  application:
    name: "pedidos"
  devtools:
    add-properties: false
  data:
    mongodb:
      # Apuntamos a una base de datos específica llamada pedidos_db
      uri: "mongodb://localhost:27017/pedidos_db"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
jwt:
  # Agregamos la clave secreta para que el filtro JWT pueda leerla
  secret: "una-clave-secreta-muy-larga-y-segura-para-firmar-el-token-123456"