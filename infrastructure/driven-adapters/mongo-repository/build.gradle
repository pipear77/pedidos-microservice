    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.reactivecommons.utils:object-mapper-api:0.1.0'

    // AGREGA ESTA LÍNEA PARA TENER RESTCLIENT Y @COMPONENT
